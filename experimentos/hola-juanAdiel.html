<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola Juan</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      color: #2563eb;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      border: none;
      background-color: #2563eb;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="contenedor">
    <h1 id="mensaje">Bienvenido</h1>

    <button onclick="saludar()">
      Mostrar saludo
    </button>
  </div>

  <script>
    function saludar() {
      const nombre = "Juan Adiel";

      document.getElementById("mensaje").innerText =
        `Hola ${nombre}, bienvenido a Python Lab Classroom`;
    }
  </script>

</body>
</html>
