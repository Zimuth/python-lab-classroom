name: CI Pipeline - SB Python

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'apps/sb-python/**'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'apps/sb-python/**'

jobs:
  python-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/sb-python

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi

      - name: Ejecutar tests automáticos
        run: pytest app/

      - name: Verificar construcción de imagen Docker
        run: docker build -t sb-python:latest .
